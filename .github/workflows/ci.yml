name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test (Windows)
    # pinned, not windows-latest: libjxl is configured by the `cmake` crate with the Visual Studio
    # generator for the newest VS it finds, and an image whose VS is newer than its CMake (VS 2026
    # with a CMake that has no "Visual Studio 18 2026" generator) could not build it
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rav1d (AV1 decoding) builds its assembly with NASM
      - uses: ilammy/setup-nasm@v1

      # libjxl (JPEG XL encoding, crates/iv-libjxl) is built with CMake and the MSVC toolset; the
      # Windows images have CMake on PATH; this fails here, clearly, when it is missing or does not
      # know the generator for the image's Visual Studio 2022
      - name: CMake
        shell: pwsh
        run: |
          cmake --version
          if (-not (cmake --help | Select-String -SimpleMatch "Visual Studio 17 2022")) { throw "CMake has no Visual Studio 17 2022 generator" }

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The HEIF test skips itself when the runner has no WIC HEIF/HEVC codec (the decoder reports
      # Error::CodecMissing). --no-fail-fast reports every failing test binary at once.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

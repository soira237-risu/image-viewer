[workspace]
resolver = "3"
members = ["crates/iv-core", "crates/iv-codec", "crates/iv-cli", "crates/iv-render", "crates/iv-app", "crates/iv-pipeline", "crates/iv-ops"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
iv-core = { path = "crates/iv-core" }
iv-codec = { path = "crates/iv-codec" }
iv-render = { path = "crates/iv-render" }
iv-pipeline = { path = "crates/iv-pipeline" }
iv-ops = { path = "crates/iv-ops" }

thiserror = "2"
image = { version = "0.25.10", default-features = false, features = [
    "avif", "bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "rayon",
] }
zune-jpeg = "0.5.15"
zune-core = "0.5"
kamadak-exif = "0.6.2"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30.0.2"
winit = "0.30.13"
pollster = "1"
fast_image_resize = "6.1"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
avif-decode = { version = "3.0.0", default-features = false }
avif-parse = "2.1"
jxl-oxide = { version = "0.12.6", features = ["image"] }
resvg = "0.50"
png = "0.18"
moxcms = "0.9.2"
webp = "0.3.1"
rayon = "1.12"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }
zune-jpegxl = "0.5.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
rfd = "0.18"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# Decoders are the hot path; keep them optimized even in dev builds so timings stay meaningful.
[profile.dev.package."*"]
opt-level = 3

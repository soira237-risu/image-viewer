[workspace]
resolver = "3"
members = ["crates/iv-core", "crates/iv-codec", "crates/iv-cli", "crates/iv-pipeline", "crates/iv-ops", "crates/iv-win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# the highest rust-version among the locked dependencies (avif-decode 3.0); scripts/package.ps1 checks it
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
iv-core = { path = "crates/iv-core" }
iv-codec = { path = "crates/iv-codec" }
iv-pipeline = { path = "crates/iv-pipeline" }
iv-ops = { path = "crates/iv-ops" }

thiserror = "2"
image = { version = "0.25.10", default-features = false, features = [
    "avif", "bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "rayon",
] }
zune-jpeg = "0.5.15"
zune-core = "0.5"
kamadak-exif = "0.6.2"
bytemuck = { version = "1", features = ["derive"] }
# Member crates take dependencies with exactly these features (no per-crate additions): a crate
# built alone (`-p`) then resolves the same features as the whole workspace, so it reuses the same
# compiled units instead of adding a second copy of large crates to target/.
fast_image_resize = { version = "6.1", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
avif-decode = { version = "3.0.0", default-features = false }
avif-parse = "2.1"
jxl-oxide = { version = "0.12.6", features = ["image"] }
resvg = "0.50"
png = "0.18"
moxcms = "0.9.2"
webp = "0.3.1"
rayon = "1.12"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false }
zune-jpegxl = "0.5.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.dev]
# line numbers for panics and backtraces, without full variable info (that made 1.7 GB of .pdb)
debug = "line-tables-only"

# Decoders are the hot path; keep them optimized even in dev builds so timings stay meaningful.
[profile.dev.package."*"]
opt-level = 3
# dependencies carry no debug info: it made target/debug grow past 50 GB; our own crates keep theirs
debug = false

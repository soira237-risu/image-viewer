[package]
name = "iv-win"
description = "The image viewer window, on plain Win32: no GPU driver, no UI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "image-viewer"
path = "src/main.rs"

[dependencies]
iv-core.workspace = true
iv-codec.workspace = true
iv-ops.workspace = true
iv-pipeline.workspace = true
fast_image_resize = { workspace = true, features = ["rayon"] }
rayon.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true
bytemuck.workspace = true

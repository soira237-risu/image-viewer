[package]
name = "iv-win"
description = "The image viewer window, on plain Win32: no GPU driver, no UI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "image-viewer"
path = "src/main.rs"

[dependencies]
iv-core.workspace = true
iv-codec.workspace = true
iv-ops.workspace = true
iv-pipeline.workspace = true
fast_image_resize.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
bytemuck.workspace = true
# the app icon's generator and its check (src/app_icon.rs)
png.workspace = true
